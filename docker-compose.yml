services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5001}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-http://localhost:5001}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - orgos-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=5001
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - CHROMA_HOST=${CHROMA_HOST:-chroma}
      - CHROMA_PORT=${CHROMA_PORT:-8000}
      - DIARIZATION_URL=http://diarization:8001
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/models/whisper:/app/models/whisper
      - whisper-cache:/app/whisper-cache
    depends_on:
      - redis
      - chroma
      - diarization
    networks:
      - orgos-network

  diarization:
    build:
      context: ./diarization
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    networks:
      - orgos-network
    # Pyannote pipeline takes ~60s to load on first start.
    # Backend will retry diarization gracefully and fall back
    # to LLM if the service isn't ready yet.
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - orgos-network

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - orgos-network

volumes:
  redis_data:
  chroma_data:
  whisper-cache:
  # Persists downloaded HuggingFace model weights across container restarts.
  # Without this, pyannote re-downloads ~1GB of models every time the
  # diarization container is rebuilt or restarted.
  huggingface-cache:

networks:
  orgos-network:
    driver: bridge